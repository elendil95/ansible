---
# Mirrors playbook-main.yml minus setup_services (requires systemd).
# Connects as testuser and becomes root via sudo, so SUDO_USER is set and
# gather_facts resolves remote_regular_user the same way as a real deployment.
#
# The pywal tasks in setup_dwm are skipped via molecule_testing: true (set in
# molecule.yml).
# The wal_cache files in molecule/default/files/ are seeded
# beforehand so the dwm build has the colorscheme headers it needs.
- name: Converge
  hosts: all
  become: true
  tasks:
    - name: Run gather_facts role
      ansible.builtin.include_role:
        name: gather_facts
        apply:
          become: false

    - name: Run install_packages role
      ansible.builtin.include_role:
        name: install_packages

    # This role is skipped since there are currently no python packages being installed
    # - name: Run install_python_packages role
    #   ansible.builtin.include_role:
    #     name: install_python_packages

    - name: Run setup_aur role
      ansible.builtin.include_role:
        name: setup_aur

    - name: Run install_aur_packages role
      ansible.builtin.include_role:
        name: install_aur_packages

    - name: Run clone_repos role
      ansible.builtin.include_role:
        name: clone_repos

    - name: Run setup_homedir role
      ansible.builtin.include_role:
        name: setup_homedir

    - name: Run stow_config_files role
      ansible.builtin.include_role:
        name: stow_config_files

    - name: Run setup_st role
      ansible.builtin.include_role:
        name: setup_st

    - name: Run setup_dmenu role
      ansible.builtin.include_role:
        name: setup_dmenu

    - name: Run setup_slstatus role
      ansible.builtin.include_role:
        name: setup_slstatus

    - name: Create pywal cache directory
      ansible.builtin.file:
        path: /home/{{ remote_regular_user }}/.cache/wal
        state: directory
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user_group }}"
        mode: "0755"

    - name: Seed pywal cache so dwm can compile without running wal
      ansible.builtin.copy:
        src: files/wal_cache/
        dest: /home/{{ remote_regular_user }}/.cache/wal/
        owner: "{{ remote_regular_user }}"
        group: "{{ remote_regular_user_group }}"
        mode: "0644"

    - name: Run setup_dwm role
      ansible.builtin.include_role:
        name: setup_dwm

    # This last role should NEVER be run in molecule, since theres no SystemD inside the docker container
    # - name: Run setup_services role
    #   ansible.builtin.include_role:
    #     name: setup_services
