---
- name: Restart check-updates service
  ansible.builtin.systemd_service:
    name: check-updates
    enabled: true
    state: restarted
    daemon_reload: true

- name: Start geoclue user service
  ansible.builtin.systemd_service:
    name: geoclue-agent.service
    enabled: true
    state: started
    daemon_reload: true
    scope: user
  become: false

- name: Restart reflector service
  ansible.builtin.systemd_service:
    name: reflector
    enabled: true
    state: restarted
    daemon_reload: true

- name: Restart reflector timer
  ansible.builtin.systemd_service:
    name: reflector.timer
    enabled: true
    state: restarted
    daemon_reload: true
